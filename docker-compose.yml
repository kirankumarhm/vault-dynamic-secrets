# Local end-to-end stack: PostgreSQL + Vault (dev) + one-shot provisioner + app.
#
#   docker compose up --build
#   curl localhost:8080/payments
#
# Startup order is enforced with healthchecks + depends_on:
#   postgres (healthy) + vault (healthy) -> vault-init (provisions, exits 0)
#   -> app (sources the AppRole creds vault-init wrote, then starts).
#
# Dev Vault only (in-memory, auto-unsealed, root token "root"). NOT for production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Create the payments table on first init.
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.20
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      PG_HOST: postgres
      SHARED_DIR: /shared
    volumes:
      - ./docker/vault-init.sh:/vault-init.sh:ro
      - approle-creds:/shared
    entrypoint: ["sh", "/vault-init.sh"]
    restart: "no"

  app:
    build: .
    image: vault-dynamic-secrets:latest
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      # refresh-scope (default) or mxbean
      APP_VAULT_ROTATIONSTRATEGY: refresh-scope
    volumes:
      - approle-creds:/shared:ro
    # Source the AppRole creds vault-init produced, then launch.
    entrypoint:
      - sh
      - -c
      - 'set -a; . /shared/vault.env; set +a; exec java $$JAVA_OPTS org.springframework.boot.loader.launch.JarLauncher'
    ports:
      - "8080:8080"

volumes:
  pgdata:
  approle-creds:
