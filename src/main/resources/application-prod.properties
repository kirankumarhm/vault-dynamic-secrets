# Feature #6: externalized, per-environment configuration.
# Activate with:  --spring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# Any value here can be further overridden by an env var or an external
# properties file without rebuilding the jar.

# Don't leak health internals publicly in production
management.endpoint.health.show-details=when-authorized

# Checklist #1: larger pool for production load (tune to real traffic + DB limits).
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10

# Checklist #44: lock CORS to the real front-end origin in production.
app.cors.allowed-origins=https://yourdomain.com
