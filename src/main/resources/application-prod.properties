# ==============================================================================
# Production Profile Configuration (SPRING_PROFILES_ACTIVE=prod)
# ==============================================================================

# Checklist #1: Production Connection Pool Sizing & Lifecycle
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
# In production with 24h max TTL, recycle idle connections at 45 minutes
spring.datasource.hikari.max-lifetime=2700000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# Production Lease Renewal Parameters (for 1h default TTL / 24h max TTL)
# Renew lease every 15 minutes, trigger rotation if within 5 minutes of expiration
spring.cloud.vault.config.lifecycle.min-renewal=15m
spring.cloud.vault.config.lifecycle.expiry-threshold=5m

# Don't leak health internals publicly in production
management.endpoint.health.show-details=when-authorized

# Checklist #44: lock CORS to the real front-end origin in production
app.cors.allowed-origins=https://yourcompany.com
