spring.application.name=vault-dynamic-secrets

# ------------------------------------------------------------------ Vault
# configure access to Vault
spring.cloud.vault.uri=${VAULT_ADDR:http://127.0.0.1:8200}

# Production auth (the video's one explicit hint): AppRole, not a dev token.
# role_id/secret_id come from the environment (see vault.env, gitignored).
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_APPROLE_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_APPROLE_SECRET_ID}

# fail startup if Vault is unreachable rather than starting without secrets
spring.cloud.vault.fail-fast=true

# set up configuration import from Vault
spring.config.import=vault://

# configure KV backend
spring.cloud.vault.kv.enabled=false

# configure database secrets engine
spring.cloud.vault.database.enabled=true
spring.cloud.vault.database.role=payments-app
spring.cloud.vault.database.backend=database

# tune lease renewal and expiry threshold for 2 minute max ttl
spring.cloud.vault.config.lifecycle.min-renewal=30s
spring.cloud.vault.config.lifecycle.expiry-threshold=10s

# configure access to database (username/password supplied dynamically by Vault)
spring.datasource.url=jdbc:postgresql://localhost/payments

# ------------------------------------------------------------------ JPA / Hibernate
# The schema is owned by scripts/schema.sql — Hibernate must never touch DDL.
spring.jpa.hibernate.ddl-auto=none
# Don't hold a DB connection open for the whole request (avoids the OSIV warning
# and, more importantly, pinning a Vault-issued connection longer than needed).
spring.jpa.open-in-view=false
# Store/read Instants as UTC so timestamps are stable across rotations/JVMs.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------ Credential rotation strategy
# How the app absorbs a Vault-rotated DB credential when the lease expires:
#   refresh-scope : rebuild the @RefreshScope DataSource via ContextRefresher
#                   (VaultRefresher). Simple; rebuilds lazily on next request.
#   mxbean        : hot-swap user/password on the live HikariCP pool +
#                   softEvictConnections (HikariCredentialRotator). Lower overhead,
#                   no context teardown, no lazy-rebuild gap.
# Exactly one strategy is wired in at startup (see the @ConditionalOnProperty beans).
app.vault.rotation-strategy=refresh-scope

# ------------------------------------------------- Checklist #1/#2/#3: HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
# surface connections held longer than 60s (likely leaks)
spring.datasource.hikari.leak-detection-threshold=60000
# Recycle connections before the Vault lease max_ttl (2m) revokes their credential.
# Keep this comfortably UNDER max_ttl so no in-use connection is killed server-side.
spring.datasource.hikari.max-lifetime=90000

# ------------------------------------------------- Feature #2/#4/#5: Actuator
# health + info (build details) + metrics + prometheus scrape endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# probes for orchestrators (k8s liveness/readiness)
management.endpoint.health.probes.enabled=true
# show build-info.properties (generated by the build-info Maven goal) on /actuator/info
management.info.build.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# ------------------------------------------------- Production hardening
# RFC 7807 problem+json error bodies
spring.mvc.problemdetails.enabled=true
# finish in-flight requests before shutting down
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ------------------------------------------------- Checklist #35: response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=1024

# ------------------------------------------------- Checklist #44: CORS allow-list
# Comma-separated origins consumed by WebConfig. Override per-environment; never use '*'.
app.cors.allowed-origins=http://localhost:3000
