# Test context configuration — no Vault, no live rotation.
#
# Tests must never reach a Vault server, so disable Spring Cloud Vault and clear
# the vault:// config import. `rotation-strategy=none` switches OFF both rotation
# beans (DataSourceConfig/@RefreshScope, VaultRefresher, HikariCredentialRotator),
# so no SecretLeaseContainer bean is required and the context starts cleanly.
spring.cloud.vault.enabled=false
spring.config.import=
app.vault.rotation-strategy=none

# JPA: schema is provided by the test (Testcontainers init script); never DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Needed by WebConfig (CORS) in the @WebMvcTest slice.
app.cors.allowed-origins=http://localhost:3000
