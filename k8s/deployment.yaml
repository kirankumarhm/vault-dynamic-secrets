apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-dynamic-secrets
  namespace: default
  labels:
    app: vault-dynamic-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-dynamic-secrets-config
  namespace: default
  labels:
    app: vault-dynamic-secrets
data:
  VAULT_ADDR: "https://vault.vault.svc.cluster.local:8200"
  VAULT_AUTH_METHOD: "KUBERNETES"
  VAULT_K8S_ROLE: "payments-app"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.default.svc.cluster.local:5432/payments"
  VAULT_SSL_TRUST_STORE: "file:/vault/tls/vault-truststore.jks"
  VAULT_SSL_TRUST_STORE_PASSWORD: "changeit"
  APP_VAULT_ROTATION_STRATEGY: "refresh-scope"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.default.svc:4318/v1/traces"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-dynamic-secrets
  namespace: default
  labels:
    app: vault-dynamic-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-dynamic-secrets
  template:
    metadata:
      labels:
        app: vault-dynamic-secrets
    spec:
      serviceAccountName: vault-dynamic-secrets
      containers:
        - name: app
          image: vault-dynamic-secrets:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vault-dynamic-secrets-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: vault-truststore
              mountPath: /vault/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault-truststore
          secret:
            secretName: vault-truststore
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault-dynamic-secrets
  namespace: default
  labels:
    app: vault-dynamic-secrets
spec:
  type: ClusterIP
  selector:
    app: vault-dynamic-secrets
  ports:
    - name: http
      port: 8080
      targetPort: 8080
