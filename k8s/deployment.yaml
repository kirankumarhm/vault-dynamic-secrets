apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-dynamic-secrets-config
  namespace: default
  labels:
    app: vault-dynamic-secrets
data:
  VAULT_ADDR: "https://vault.vault.svc.cluster.local:8200"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.default.svc.cluster.local:5432/payments"
  VAULT_SSL_TRUST_STORE: "file:/vault/tls/vault-truststore.jks"
  VAULT_SSL_TRUST_STORE_PASSWORD: "changeit"
  APP_VAULT_ROTATION_STRATEGY: "refresh-scope"
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-dynamic-secrets-approle
  namespace: default
  labels:
    app: vault-dynamic-secrets
type: Opaque
stringData:
  VAULT_APPROLE_ROLE_ID: "6428e491-937b-e743-b374-4bb9a8718ee4"
  VAULT_APPROLE_SECRET_ID: "72522b88-a163-946a-c064-a5b31b54e5f1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-dynamic-secrets
  namespace: default
  labels:
    app: vault-dynamic-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-dynamic-secrets
  template:
    metadata:
      labels:
        app: vault-dynamic-secrets
    spec:
      containers:
        - name: app
          image: vault-dynamic-secrets:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vault-dynamic-secrets-config
            - secretRef:
                name: vault-dynamic-secrets-approle
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: vault-truststore
              mountPath: /vault/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault-truststore
          secret:
            secretName: vault-truststore
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault-dynamic-secrets
  namespace: default
  labels:
    app: vault-dynamic-secrets
spec:
  type: ClusterIP
  selector:
    app: vault-dynamic-secrets
  ports:
    - name: http
      port: 8080
      targetPort: 8080
